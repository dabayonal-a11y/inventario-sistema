spring.application.name=sistema-inventario

# ──────────────────────────────────────────────────────────
# Conexion a MySQL – usa variables de Railway en produccion
# o las valores locales de XAMPP como fallback
# ──────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/sistema_inventario?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Puerto dinamico de Railway
server.port=${PORT:8080}
