spring.application.name=sistema-inventario

# ──────────────────────────────────────────────────────────────────────────────
# Base de datos: Railway inyecta estas variables al conectar el plugin MySQL.
# Para desarrollo local con XAMPP se usan los valores por defecto (fallback).
# ──────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${MYSQLHOST:127.0.0.1}:${MYSQLPORT:3306}/${MYSQLDATABASE:sistema_inventario}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Puerto dinamico de Railway (en local usa 8080)
server.port=${PORT:8080}
